services:
  worker:
    image: ${SUBLINK_WORKER_IMAGE:-ghcr.io/7sageer/sublink-worker:latest}
    pull_policy: always
    ports:
      - "8787:8787"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_KEY_PREFIX: sublink
      # Set to 0 to keep stored configs without automatic expiration.
      CONFIG_TTL_SECONDS: 2592000
      THREE_X_UI_BASE_URL: https://v.cslee.cc/app
      THREE_X_UI_API_TOKEN_FILE: /run/secrets/3x-ui-token
      THREE_X_UI_TIMEOUT_MS: 3000
      THREE_X_UI_CONCURRENCY: 5
    volumes:
      - ../.3x-ui-token:/run/secrets/3x-ui-token:ro
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
volumes:
  redis-data:
