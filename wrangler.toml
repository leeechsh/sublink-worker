#:schema node_modules/wrangler/config-schema.json
name = "sublink-worker"
main = "src/worker.jsx"
compatibility_date = "2024-07-24"
compatibility_flags = ["nodejs_compat"]
# THREE_X_UI_BASE_URL and THREE_X_UI_API_TOKEN are managed in the dashboard.
# Preserve dashboard bindings when deploying with Wrangler.
keep_vars = true

kv_namespaces = [
  { binding = "SUBLINK_KV", id = "8943789ed0af49659f887fc740d11240" }
]

[assets]
directory = "./public"
